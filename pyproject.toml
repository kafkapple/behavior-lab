[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-lab"
version = "0.1.0"
description = "Modular skeleton-based behavior recognition platform for humans and animals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Joon"},
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.62",
    "einops>=0.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0", "torchvision>=0.15"]
visual = ["torch>=2.0", "torchvision>=0.15"]
cebra = ["cebra>=0.4"]
videomae = ["transformers>=4.22", "av<14"]
# external/BehaveMAE 서브모듈이 models/general_hiera.py 에서 timm 을 import 한다 (260814 확인)
behavemae = ["timm>=0.9"]
dlc = ["deeplabcut[modelzoo]>=3.0.0rc1"]
sleap = ["sleap-io>=0.1.0", "h5py>=3.8"]
web = ["fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.6"]
viz = ["matplotlib>=3.6", "seaborn>=0.12", "imageio>=2.25", "imageio-ffmpeg>=0.4", "opencv-python-headless>=4.8"]
clustering = ["umap-learn>=0.5"]
# Dataset loaders
loaders = ["h5py>=3.8"]
# External model wrappers
bsoid = ["umap-learn>=0.5", "hdbscan>=0.8"]
# 0.4.x pins jaxtyping==0.2.14 against an unpinned dynamax and does not import; >=0.6 depends on
# jax-cuda12 (Linux wheels only), so the extra is Linux-only (261001). Working set: env_snapshots/kpms.yml
moseq = [
    "keypoint-moseq>=0.6; sys_platform == 'linux' and python_version < '3.13'",
    # without this floor the resolver backtracks to jax-moseq 0.2.2 (jaxtyping==0.2.14 pin, import fails)
    "jax-moseq>=0.3; sys_platform == 'linux' and python_version < '3.13'",
    # dynamax pulls tfp-nightly unpinned; a newer nightly breaks against jax<0.7 (tfb.Bijector missing).
    # Pinned to the set recorded in env_snapshots/kpms.yml.
    "jax>=0.6,<0.7; sys_platform == 'linux' and python_version < '3.13'",
    "tfp-nightly==0.26.0.dev20260704; sys_platform == 'linux' and python_version < '3.13'",
]
moseq-fallback = ["hmmlearn>=0.3"]
subtle = ["subtle"]
vame = ["vame-py>=0.14; python_version >= '3.12'"]
# pyskl removed from extras (261001): not on PyPI, git source pins mmcv-full 1.5.0 which does not build; install separately if needed
# Benchmark
benchmark = ["joblib>=1.2"]
# `external` aggregate removed (261001): moseq (jax) and the others pin conflicting numpy, see scripts/isolated_run.py. Install one external method per env.
all = ["behavior-lab[torch,viz,clustering,bsoid,loaders,benchmark,behavemae]"]
dev = ["behavior-lab[all]", "pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1", "mypy>=1.0"]

[project.scripts]
behavior-lab-train = "scripts.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# external/BehaveMAE = 서브모듈. test_behavemae.py 가 `from models.models_defs import …` 를 요구하는데
# 그 `models` 패키지가 여기 산다. 260814 이전엔 각 머신 PYTHONPATH 에 의존해 clean 환경에서 깨졌다.
pythonpath = ["src", "external/BehaveMAE"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.uv]
conflicts = [
    [{ extra = "moseq" }, { extra = "vame" }, { extra = "subtle" }, { extra = "bsoid" }],
]

[tool.uv.sources]
# PyPI "subtle" is an unrelated subtitle downloader (checked 261001); the SUBTLE package is installed from GitHub
subtle = { git = "https://github.com/jeakwon/subtle.git" }
